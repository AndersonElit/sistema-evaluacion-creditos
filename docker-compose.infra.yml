version: "3.9"

networks:
  creditos-net:
    driver: bridge

services:

  # ── PostgreSQL: ms-credit-evaluation ──────────────────────────
  postgres-credits:
    image: postgres:16
    container_name: postgres-credits
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: creditos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - creditos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d creditos_db"]
      interval: 5s
      retries: 5

  # ── PostgreSQL: ms-notifications ──────────────────────────────
  postgres-notifications:
    image: postgres:16
    container_name: postgres-notifications
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: notifications_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - creditos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications_db"]
      interval: 5s
      retries: 5

  # ── PostgreSQL: Keycloak ───────────────────────────────────────
  postgres-keycloak:
    image: postgres:16
    container_name: postgres-keycloak
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - creditos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak_db"]
      interval: 5s
      retries: 5

  # ── Keycloak ──────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev
    ports:
      - "9000:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - creditos-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -c 12 <&3 | grep -q '200'"]
      interval: 10s
      retries: 10
      start_period: 30s

  # ── LocalStack (SQS + SES) ────────────────────────────────────
  localstack:
    image: localstack/localstack:3.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,ses
      DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ""
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    networks:
      - creditos-net
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues || exit 1"]
      interval: 5s
      retries: 10
      start_period: 15s
