# ── Config estructural (invariable entre entornos) ─────────────
# Los valores de entorno (credenciales, URLs) se cargan desde
# AWS SSM Parameter Store vía SsmConfigSource al arrancar.
# En tests (SSM_PREFIX no seteado) se usan los valores de
# src/test/resources/application.properties directamente.

quarkus.http.port=8083
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=validate

# ── AWS SQS: credenciales siempre desde variables de entorno ───
# El endpoint y la URL de la cola vienen de SSM.
quarkus.sqs.aws.region=${AWS_REGION}
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID}
quarkus.sqs.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# ── AWS SES: credenciales siempre desde variables de entorno ───
# El endpoint y el from-email vienen de SSM.
quarkus.ses.aws.region=${AWS_REGION}
quarkus.ses.aws.credentials.type=static
quarkus.ses.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID}
quarkus.ses.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# ── Health ─────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health

# ── Logging ────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.msnotifications".level=DEBUG
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."software.amazon".level=WARN
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) - %s%e%n
quarkus.log.console.color=true
