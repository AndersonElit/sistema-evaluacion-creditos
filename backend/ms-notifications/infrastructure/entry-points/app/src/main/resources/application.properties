# ── Config estructural (invariable entre entornos) ─────────────
# Los valores de entorno (credenciales, URLs) se cargan desde
# AWS SSM Parameter Store vía SsmConfigSource al arrancar.
# En tests (SSM_PREFIX no seteado) se usan los valores de
# src/test/resources/application.properties directamente.

quarkus.http.port=8083
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=validate

# ── AWS SQS: credenciales siempre desde variables de entorno ───
# El endpoint y la URL de la cola vienen de SSM.
quarkus.sqs.aws.region=${AWS_REGION:us-east-1}
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
quarkus.sqs.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}

# ── AWS SES: credenciales siempre desde variables de entorno ───
# El endpoint y el from-email vienen de SSM.
quarkus.ses.aws.region=${AWS_REGION:us-east-1}
quarkus.ses.aws.credentials.type=static
quarkus.ses.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
quarkus.ses.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}

# ── Health ─────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health
