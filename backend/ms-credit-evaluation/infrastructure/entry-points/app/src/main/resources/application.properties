# ── Config estructural (invariable entre entornos) ─────────────
# Los valores de entorno (credenciales, URLs) se cargan desde
# AWS SSM Parameter Store vía SsmConfigSource al arrancar.
# En tests (SSM_PREFIX no seteado) se usan los valores de
# src/test/resources/application.properties directamente.

quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=validate
quarkus.smallrye-jwt.role-paths=groups

# ── HTTP Security ──────────────────────────────────────────────
quarkus.http.auth.permission.public.paths=/q/health,/q/health/*,/q/openapi,/swagger-ui,/swagger-ui/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ── CORS ───────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# ── AWS SQS: credenciales siempre desde variables de entorno ───
# El endpoint y la URL de la cola vienen de SSM.
quarkus.sqs.aws.region=${AWS_REGION}
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID}
quarkus.sqs.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# ── OpenAPI / Swagger ──────────────────────────────────────────
mp.openapi.extensions.smallrye.info.version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# ── Health ─────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health

# ── Logging ────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.mscreditevaluation".level=DEBUG
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."software.amazon".level=WARN
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) - %s%e%n
quarkus.log.console.color=true
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern="%{REMOTE_HOST} %r %s %b %D ms"
