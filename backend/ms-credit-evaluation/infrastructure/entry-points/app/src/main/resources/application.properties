# HTTP
quarkus.http.port=${SERVER_PORT:8080}

# DataSource - PostgreSQL Reactive
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://localhost:5432/creditos_db}
quarkus.hibernate-orm.database.generation=validate

# JWT/OIDC - Keycloak
mp.jwt.verify.publickey.location=${KEYCLOAK_URL:http://localhost:9000}/realms/${KEYCLOAK_REALM:banco}/protocol/openid-connect/certs
mp.jwt.verify.issuer=${KEYCLOAK_URL:http://localhost:9000}/realms/${KEYCLOAK_REALM:banco}
quarkus.smallrye-jwt.role-paths=groups

# HTTP Security
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# REST Client ms-risk
quarkus.rest-client.risk-service.url=${RISK_SERVICE_URL:http://localhost:8081}

# AWS SQS
quarkus.sqs.aws.region=${AWS_REGION:us-east-1}
quarkus.sqs.endpoint-override=${SQS_ENDPOINT_URL:http://localhost:4566}
sqs.queue.url=${SQS_QUEUE_URL:http://localhost:4566/000000000000/credit-evaluation-notifications}

aws.accessKeyId=${AWS_ACCESS_KEY_ID:test}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:test}

# OpenAPI / Swagger UI
mp.openapi.extensions.smallrye.info.version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Health
quarkus.smallrye-health.root-path=/q/health
