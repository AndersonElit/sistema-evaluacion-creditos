# DevServices deshabilitado — se usa el contenedor postgres-credits de Docker Compose
quarkus.devservices.enabled=false

# DataSource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.reactive.url=postgresql://localhost:5432/creditos_db
quarkus.hibernate-orm.database.generation=drop-and-create

# HTTP Security
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ms-risk apunta a WireMock en test
quarkus.rest-client.risk-service.url=http://localhost:9090

# SQS: errores son silenciados por el use case (fire-and-forget)
quarkus.sqs.aws.region=us-east-1
quarkus.sqs.endpoint-override=http://localhost:4566
sqs.queue.url=http://localhost:4566/000000000000/credit-evaluation-notifications
aws.accessKeyId=test
aws.secretAccessKey=test
